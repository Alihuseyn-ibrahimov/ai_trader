# Freqtrade versiyası qəsdən sabitlənib (`latest`/`stable` yox) — backtest
# nəticələri versiyalar arasında müqayisə oluna bilsin.
services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.9
    restart: "no"
    container_name: ai_trader_freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
      # Analiz skriptləri (data keyfiyyəti, baseline) — yalnız oxumaq üçün
      - "./tools:/freqtrade/tools:ro"
      - "./tests:/freqtrade/ai_tests:ro"
      # Risk modulu — strategiyalar /freqtrade/risk-dən import edir
      - "./risk:/freqtrade/risk:ro"
      # Siqnal məntiqi (indikatorlar, giriş/çıxış qaydaları)
      - "./signals:/freqtrade/signals:ro"
    # Birdəfəlik əmrlər (backtest, analiz): `docker compose run --rm freqtrade ...`
    command: >
      --version

  # Faza 1 — daimi paper trading bot-u (dry_run, birja açarı yoxdur).
  # Başlatmaq: `docker compose up -d paper`, dayandırmaq: `docker compose stop paper`.
  # Telegram token və chat_id yalnız .env-dən (commit olunmur; nümunə: .env.example).
  paper:
    image: freqtradeorg/freqtrade:2026.9
    restart: unless-stopped
    container_name: ai_trader_paper
    # VPS n8n ilə paylaşılır — yaddaş və Docker log həcmi məhdudlaşdırılır
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: true
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./tools:/freqtrade/tools:ro"
      - "./risk:/freqtrade/risk:ro"
      - "./signals:/freqtrade/signals:ro"
    command:
      - trade
      - --config
      - user_data/config.paper.json
      - --logfile
      - user_data/logs/paper.log

  # Çoxagentli analiz + KÖLGƏ qərar (plan: .planning/2026-10-12-ai-trader-agents/).
  # Qərarlar icra olunmur. Bot-a toxunmur: kod və paper config :ro, yeganə yazılan yer
  # user_data/shadow/. `up -d` bu servisi başlatmır (profile) — cron gündə 1 dəfə `run` edir:
  #   docker compose run --rm -T agents python -m agents.run --send
  agents:
    build: ./agents
    image: ai_trader_agents:1
    profiles: ["agents"]
    restart: "no"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - path: .env
        required: true
    environment:
      LANGSMITH_TRACING: "true"
      LANGSMITH_PROJECT: ai-trader-agents
    volumes:
      - "./agents:/app/agents:ro"
      - "./tools:/app/tools:ro"
      - "./risk:/app/risk:ro"
      - "./signals:/app/signals:ro"
      - "./user_data/config.paper.json:/app/user_data/config.paper.json:ro"
      - "./user_data/shadow:/app/user_data/shadow"
    command: ["python", "-m", "agents.run"]
