# Freqtrade versiyası qəsdən sabitlənib (`latest`/`stable` yox) — backtest
# nəticələri versiyalar arasında müqayisə oluna bilsin.
services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.9
    restart: "no"
    container_name: ai_trader_freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
      # Analiz skriptləri (data keyfiyyəti, baseline) — yalnız oxumaq üçün
      - "./tools:/freqtrade/tools:ro"
      - "./tests:/freqtrade/ai_tests:ro"
      # Risk modulu — strategiyalar /freqtrade/risk-dən import edir
      - "./risk:/freqtrade/risk:ro"
      # Siqnal məntiqi (indikatorlar, giriş/çıxış qaydaları)
      - "./signals:/freqtrade/signals:ro"
    # Faza 0: yalnız backtest, bot daimi işləmir. Əmrlər `docker compose run --rm` ilə.
    command: >
      --version
